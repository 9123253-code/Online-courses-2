<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація на курси</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form id="myForm">
        <h2>Реєстрація на курси</h2>

        <input type="text" id="name" placeholder="Ім'я" required>
        <small class="error" id="nameError"></small>

        <input type="email" id="email" placeholder="Email" required>
        <small class="error" id="emailError"></small>

        <input type="password" id="password" placeholder="Пароль" required>
        <small class="error" id="passwordError"></small>

        <div id="strength" class="strength"></div>

        <div class="buttons">
            <button type="submit" class="submit-btn">Зареєструватися</button>
            <button type="reset" class="reset-btn">Очистити</button>
        </div>
    </form>

    <script src="script.js"></script>
</body>

</html>
